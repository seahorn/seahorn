name: Licensing
on:
  pull_request:
  push:
    branches: [dev18]
permissions:
  contents: read
jobs:
  licensing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reuse==6.3.0
      - run: reuse lint
      - run: python utils/spdx.py --check
