# workflow to build and test seahorn

name: CI

# Controls when the action will run.
on:
  # dev16 branch copy: build and test with the LLVM 16 toolchain.
  push:
    branches: dev16
  pull_request:
    branches: dev16

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "test"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # read access to pull the buildpack-deps base image from GHCR
    permissions:
      contents: read
      packages: read

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check Out Repo
        uses: actions/checkout@v2
      - name: Login to GitHub Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      # Persist the ccache directory across runs so only changed translation
      # units recompile. PR builds restore the dev16 cache via restore-keys.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-llvm16-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-llvm16-${{ github.ref_name }}-
            ccache-llvm16-dev16-
            ccache-llvm16-
      - name: Build SeaHorn (ccache-backed)
        run: |
          docker run --rm \
            -v "$(pwd)":/seahorn \
            -v "$(pwd)/.ccache":/ccache \
            -e CCACHE_DIR=/ccache \
            -e BUILD_TYPE=RelWithDebInfo \
            -e LLVM_VERSION=16 \
            ghcr.io/${{ github.repository_owner }}/buildpack-deps-seahorn:jammy-llvm16 \
            bash /seahorn/docker/build_seahorn.sh
          cp build/SeaHorn*.tar.gz .
          # ccache files are written by root in the container; make them
          # readable to the runner user so actions/cache can pack them.
          sudo chown -R "$(id -u):$(id -g)" .ccache
      - name: Build seahorn container
        run: docker build . --file docker/seahorn.Dockerfile --build-arg BUILDPACK_IMAGE=ghcr.io/${{ github.repository_owner }}/buildpack-deps-seahorn --build-arg BASE_IMAGE=jammy-llvm16 --tag seahorn_container
      - name: Run opsem tests
        run: docker run -v $(pwd):/host seahorn_container /bin/bash -c "cd seahorn/share/seahorn && lit -a --time-tests --max-time=1200 test/opsem "
      - name: Run opsem2 tests
        run: docker run -v $(pwd):/host seahorn_container /bin/bash -c "cd seahorn/share/seahorn && lit -a --time-tests --max-time=1200 test/opsem2 "
      - name: Run opsem widemem tests
        run: docker run -v $(pwd):/host seahorn_container /bin/bash -c "cd seahorn/share/seahorn && lit -a --time-tests --max-time=1200 -D opsem-opts=--horn-bv2-widemem test/opsem "
      - name: Run opsem extra widemem tests  
        run: docker run -v $(pwd):/host seahorn_container /bin/bash -c "cd seahorn/share/seahorn && lit -a --time-tests --max-time=1200 -D opsem-opts=--horn-bv2-extra-widemem test/opsem "
      - name: Run mcfuzz tests
        run: docker run -v $(pwd):/host seahorn_container /bin/bash -c "cd seahorn/share/seahorn && lit -a --time-tests --max-time=1200 test/mcfuzz"
      - name: Run smc tests
        run: docker run -v $(pwd):/host seahorn_container /bin/bash -c "cd seahorn/share/seahorn && lit -a --time-tests --max-time=1200 test/smc"
      - name: Run cex tests
        run: docker run -v $(pwd):/host seahorn_container /bin/bash -c "cd seahorn/share/seahorn && lit -a --time-tests --max-time=1200 test/cex"
      - name: Run cex tests with new cexgen
        run: docker run -v $(pwd):/host seahorn_container /bin/bash -c "cd seahorn/share/seahorn && lit -a --time-tests --max-time=1200 -D cex_bmc_opts=--horn-bmc-cexgen test/cex"
      - name: Run devirtualization tests
        run: docker run -v $(pwd):/host seahorn_container /bin/bash -c "cd seahorn/share/seahorn && lit -a --time-tests --max-time=1200 test/devirt"
      # The crab and BMC(opsem) suites are deliberately not run here.
      #
      # Clam/crab is ported to LLVM 15 and 16, so these steps could be enabled.
      # They stay off by choice: the build uses WITH_CLAM=OFF so that Clam
      # remains an optional dependency and SeaHorn still compiles against a new
      # LLVM before Clam has been ported to it. Testing Clam here would turn
      # that soft dependency into a hard one.
      #
      # Because WITH_CLAM=OFF leaves HAVE_CLAM undefined, crab is compiled out
      # and neither suite can pass as configured. test/bmc needs Clam for a
      # second reason: every test also exercises --bmc=path, whose PathBmc is a
      # stub without HAVE_CLAM. Mono-BMC stays covered by the opsem/opsem2 steps.
      #
      # To run them, build with WITH_CLAM=ON -- which also needs the `crab`
      # target, since `extra` does not clone the crab library -- and uncomment:
      # - name: Run Crab tests
      #   run: docker run -v $(pwd):/host seahorn_container /bin/bash -c "cd seahorn/share/seahorn && lit -a --time-tests --max-time=1200 test/crab"
      # - name: Run BMC(opsem) tests
      #   run: docker run -v $(pwd):/host seahorn_container /bin/bash -c "cd seahorn/share/seahorn && lit -a --time-tests --max-time=1200 test/bmc"
